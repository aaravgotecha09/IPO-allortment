# Render Blueprint: Render reads this file when you choose
# "New > Blueprint" and connect this GitHub repository.
services:
  - type: web
    name: ipo-allotment-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional: set to your Vercel URL (comma separate several) to lock CORS.
      - key: ALLOWED_ORIGINS
        sync: false
